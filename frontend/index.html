<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FraudShield AI</title>
<meta name="description" content="Check any online payment for fraud in seconds with machine learning.">
<meta name="theme-color" content="#0B1020">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237C8CFF'/%3E%3Cpath d='M16 6l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V9z' fill='%230B1020'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<!-- ============ AUTH ============ -->
<main id="auth" class="auth" hidden>
  <section class="auth-card" aria-labelledby="auth-title">
    <div class="brand"><span class="logo" aria-hidden="true"></span><span>FraudShield AI</span></div>
    <h1 id="auth-title">Know a payment is risky before you trust it</h1>
    <p class="lede">Enter the details of any transaction. Our model scores it in under a second and tells you why.</p>

    <div class="tabs" role="tablist">
      <button role="tab" id="tab-login" aria-selected="true" data-mode="login">Sign in</button>
      <button role="tab" id="tab-register" aria-selected="false" data-mode="register">Create account</button>
    </div>

    <form id="auth-form" novalidate>
      <label class="field" id="name-field" hidden>
        <span>Full name</span>
        <input id="a-name" type="text" autocomplete="name" placeholder="Priya Sharma">
      </label>
      <label class="field">
        <span>Email</span>
        <input id="a-email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input id="a-pass" type="password" autocomplete="current-password" placeholder="At least 6 characters" minlength="6" required>
      </label>
      <p id="auth-msg" class="form-msg" role="alert" aria-live="polite"></p>
      <button class="btn primary wide" id="auth-submit" type="submit">Sign in</button>
    </form>
    <p class="fine">Your checks are private to your account.</p>
  </section>
</main>

<!-- ============ APP ============ -->
<div id="app" class="app" hidden>
  <aside class="side">
    <div class="brand"><span class="logo" aria-hidden="true"></span><span>FraudShield AI</span></div>
    <nav id="nav" aria-label="Main">
      <a href="#/dashboard" data-route="dashboard"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zm0 7h6v-5H4zm10 0h6v-9h-6zm0-16v5h6V4z"/></svg><span>Dashboard</span></a>
      <a href="#/check" data-route="check"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v5c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V6zm-1 12l5-5-1.4-1.4L11 12.2 9.4 10.6 8 12z"/></svg><span>Check payment</span></a>
      <a href="#/history" data-route="history"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 100 18 9 9 0 000-18zm1 9.4l3 1.8-.8 1.3L12 13V7h2z"/></svg><span>History</span></a>
      <a href="#/reports" data-route="reports"><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5zm9 1.5V8h3.5zM8 12h8v1.5H8zm0 3h8v1.5H8z"/></svg><span>Reports</span></a>
      <a href="#/model" data-route="model"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 5.6L20 8l-4.4 3.8L17 18l-5-3-5 3 1.4-6.2L4 8l5.6-.4z"/></svg><span>Model</span></a>
    </nav>
    <div class="side-foot">
      <div class="who"><span class="avatar" id="avatar">U</span><div><strong id="who-name">User</strong><small id="who-mail"></small></div></div>
      <button class="btn ghost wide" id="logout">Sign out</button>
    </div>
  </aside>
  <main id="view" class="view" tabindex="-1"></main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/assets/supabase.js"></script>
<script src="/assets/bg.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
